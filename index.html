<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcador Streaming TV - Soccer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Inter:wght@500;700;800;900&family=Oswald:wght@500;700&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="overlay" aria-label="Marcador de transmisión">
        <div class="team team-home">
          <input id="homeName" value="LOCAL" aria-label="Nombre equipo local" maxlength="14" />
          <input id="homeScore" type="number" min="0" value="0" aria-label="Goles local" />
        </div>

        <div class="clock-board">
          <div class="period" id="periodLabel">2T</div>
          <div class="clock" id="matchClock">00:00</div>
          <div class="added-time hidden" id="addedTimeBox">+0</div>
        </div>

        <div class="team team-away">
          <input id="awayScore" type="number" min="0" value="0" aria-label="Goles visitante" />
          <input id="awayName" value="VISITA" aria-label="Nombre equipo visitante" maxlength="14" />
        </div>
      </section>

      <section class="controls" aria-label="Panel de control">
        <h1>Control del Partido</h1>

        <div class="row">
          <button id="startBtn">Iniciar</button>
          <button id="pauseBtn">Pausar</button>
          <button id="resumeBtn">Reanudar</button>
          <button id="resetBtn">Reiniciar</button>
        </div>

        <div class="row">
          <label>
            Minuto objetivo
            <select id="targetMinute">
              <option value="45">45'</option>
              <option value="90" selected>90'</option>
            </select>
          </label>

          <label>
            Tiempo de adición
            <input id="addedMinutes" type="number" min="0" max="20" value="0" />
          </label>

          <button id="showAddedBtn">Mostrar +</button>
          <button id="hideAddedBtn">Ocultar +</button>
        </div>

        <h2>Personalización visual</h2>
        <div class="row theme-grid">
          <label>
            Color primario
            <input id="primaryColor" type="color" value="#19c2ff" />
          </label>
          <label>
            Color secundario
            <input id="secondaryColor" type="color" value="#8b5cf6" />
          </label>
          <label>
            Color de texto
            <input id="textColor" type="color" value="#eff4ff" />
          </label>
          <label>
            Fondo base
            <input id="baseColor" type="color" value="#081021" />
          </label>
        </div>

        <div class="row theme-grid">
          <label>
            Gradiente
            <select id="gradientPreset">
              <option value="ocean" selected>Ocean</option>
              <option value="sunset">Sunset</option>
              <option value="neon">Neon</option>
              <option value="mono">Minimal Mono</option>
            </select>
          </label>

          <label>
            Tipografía
            <select id="fontPreset">
              <option value="inter" selected>Inter</option>
              <option value="barlow">Barlow</option>
              <option value="oswald">Oswald</option>
              <option value="rajdhani">Rajdhani</option>
            </select>
          </label>

          <label>
            Estilo marcador
            <select id="surfacePreset">
              <option value="glass" selected>Glass</option>
              <option value="flat">Flat</option>
              <option value="minimal">Minimal</option>
            </select>
          </label>
        </div>

        <p class="hint">
          Diseño minimalista para overlay en OBS/Streamlabs. Guarda tu estilo automáticamente.
        </p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
